<div class="row">

    <!-- Employee List - 8 columns -->
    <div class="col-8">
        <div class="card">

            <div class="card-header bg-success text-white">
                <h6>Employee List</h6>
            </div>

            <div class="card-body">
                <div class="row">
                    <div class="col-12">

                        <table class="table table-bordered table-striped">
                            <thead>
                                <tr>
                                    <th>Sr.No</th>
                                    <th>Name</th>
                                    <th>Contact No</th>
                                    <th>Email Id</th>
                                    <th class="text-center">Action</th>
                                </tr>
                            </thead>

                            <tbody>
                               @for (item of employeeList; track $index) {
                                <tr>
                                    <td>{{$index + 1}}</td>
                                    <td>{{item.name}}</td>
                                    <td>{{item.contactNo}}</td>
                                    <td>{{item.emailid}}</td>
                                    <td class="text-center">
                                        <button class="btn btn-primary" (click)="OnEdit(item)">Edit</button>
                                        <button class="btn btn-danger mx-2" (click)="OnDelete(item.empid)">Delete</button>
                                    </td>
                                </tr>
                               }
                            </tbody>
                        </table>

                    </div>
                </div>
            </div>

        </div>
    </div>


    <!-- New Employee Form - 4 columns -->
    <div class="col-4">

        <div class="card">

            <div class="card-header bg-success text-white">
                New Employee
            </div>

            <div class="card-body">
            <form [formGroup]="employeeForm">
                 <div class="row">

                    <div class="col-12">
                        <label>Name</label>
                        <input type="text" formControlName="name" class="form-control">
                    </div>

                    <div class="col-6">
                        <label>Email Id</label>
                        <input type="text" formControlName="emailid" class="form-control">
                    </div>

                    <div class="col-6">
                        <label>Contact No.</label>
                        <input type="text" formControlName="contactNo" class="form-control">
                    </div>

                    <div class="col-6">
                        <label>City</label>
                        <input type="text" formControlName="city" class="form-control">
                    </div>

                    <div class="col-6">
                        <label>State</label>
                        <input type="text" formControlName="state" class="form-control">
                    </div>

                    <div class="col-6">
                        <label>Pin Code</label>
                        <input type="text" formControlName="pincode" class="form-control">
                    </div>

                    <div class="col-12">
                        <label>Address</label>
                        <textarea formControlName="address" class="form-control"></textarea>
                    </div>

                </div>
                <div class="row pt-2">

                    <div class="col-6 text-center">
                        <button class="btn btn-secondary" (click)="onReset()">
                            Reset
                        </button>
                    </div>

                    <div class="col-6 text-center">
                        @if(employeeForm.controls['empid'].value=='0'){
                        
                        <button class="btn btn-success" (click)="onSave()">Save</button>
                        }
                        @else{
                        <button class="btn btn-warning" (click)="onUpdate()">Update </button>
                        }
                    </div>

                </div>
            </form>
               

                

            </div>
        </div>

    </div>

</div>
